<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Berita | SMK Kehutanan Rimba Bahari</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f4;color:#173b2b}
.top{background:#075c38;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}
.top h1{margin:0;font-size:22px}.top span{font-size:13px;opacity:.85}
.wrap{max-width:1150px;margin:35px auto;padding:0 20px}
.panel{background:#fff;border-radius:16px;box-shadow:0 5px 22px rgba(0,0,0,.08);padding:28px;margin-bottom:25px}
h2{margin-top:0;color:#075c38}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin-bottom:7px;color:#174f36}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccd8d2;border-radius:9px;font:inherit}
textarea{min-height:170px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}
.primary{background:#087443;color:#fff}.secondary{background:#e7eee9;color:#075c38}
.danger{background:#b42318;color:#fff}
.actions{display:flex;gap:10px;margin-top:18px}
.status{margin-top:15px;padding:12px;border-radius:8px;display:none}
.status.ok{display:block;background:#e5f6eb;color:#126b39}
.status.err{display:block;background:#fde9e7;color:#9b241b}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 10px;border-bottom:1px solid #e5ebe7;text-align:left;vertical-align:top}
th{background:#f1f6f3;color:#075c38}
.thumb{width:75px;height:55px;object-fit:cover;border-radius:7px;background:#087443}
.smallbtn{padding:7px 10px;font-size:12px;margin:2px}
.empty{text-align:center;padding:25px;color:#777}
.preview{max-width:220px;max-height:150px;border-radius:10px;margin-top:10px;display:none}
@media(max-width:750px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:13px}.top{gap:15px;flex-direction:column;align-items:flex-start}}
</style>
<meta name="robots" content="noindex, nofollow, noarchive">
</head>
<body>
<div class="top">
  <div><h1>ADMIN BERITA</h1><span>SMK Kehutanan Rimba Bahari Sumedang</span></div>
  <a href="berita.html" style="color:#fff;text-decoration:none;font-weight:bold">← Lihat Website</a>
</div>

<div class="wrap">
  <div class="panel">
    <h2 id="formTitle">Tambah Berita</h2>
    <form id="formBerita">
      <input type="hidden" id="id">
      <div class="grid">
        <div>
          <label>Judul Berita *</label>
          <input id="judul" required placeholder="Contoh: Kegiatan Praktik Lapangan Siswa">
        </div>
        <div>
          <label>Kategori *</label>
          <select id="kategori" required>
            <option value="Berita Sekolah">Berita Sekolah</option>
            <option value="Kegiatan">Kegiatan</option>
            <option value="Prestasi">Prestasi</option>
            <option value="Pengumuman">Pengumuman</option>
            <option value="Informasi">Informasi</option>
          </select>
        </div>
        <div>
          <label>Tanggal</label>
          <input type="date" id="tanggal">
        </div>
        <div>
          <label>Foto (opsional)</label>
          <input type="file" id="fotoFile" accept="image/*">
          <img id="preview" class="preview" alt="Pratinjau foto">
        </div>
        <div class="full">
          <label>Ringkasan</label>
          <textarea id="ringkasan" style="min-height:90px" placeholder="Ringkasan singkat yang tampil di kartu berita"></textarea>
        </div>
        <div class="full">
          <label>Isi Berita *</label>
          <textarea id="isi" required placeholder="Tulis isi berita lengkap di sini..."></textarea>
        </div>
      </div>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">Simpan Berita</button>
        <button class="secondary" type="button" id="cancelBtn" style="display:none">Batal Edit</button>
      </div>
      <div id="status" class="status"></div>
    </form>
  </div>

  <div class="panel">
    <h2>Daftar Berita</h2>
    <div id="list">Memuat data...</div>
  </div>
</div>

<script src="supabase-client.js?v=5.0.0"></script>
<script>
const SUPABASE_URL="https://xzgbrzabcceqwcaxegfx.supabase.co";
const SUPABASE_KEY="sb_publishable_3ZQnb7vOMpsW1MqFVFMX2Q_2oAaQ_qf";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form=document.getElementById("formBerita");
const statusBox=document.getElementById("status");
const list=document.getElementById("list");
const fileInput=document.getElementById("fotoFile");
const preview=document.getElementById("preview");

function msg(text,ok=true){
  statusBox.textContent=text;
  statusBox.className="status "+(ok?"ok":"err");
}
function clearMsg(){statusBox.className="status";statusBox.textContent=""}
function slugify(text){
  return text.toString().toLowerCase().trim()
    .replace(/[^a-z0-9\\s-]/g,"").replace(/[\\s_-]+/g,"-").replace(/^-+|-+$/g,"");
}
function formatTanggal(v){
  if(!v)return "-";
  const d=new Date(v+"T00:00:00");
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
}
function imageUrl(v){
  if(!v)return "";
  if(/^https?:\\/\\//i.test(v)||v.startsWith("/")||v.startsWith("./"))return v;
  return `${SUPABASE_URL}/storage/v1/object/public/berita/${v}`;
}
function resetForm(){
  form.reset();
  document.getElementById("id").value="";
  document.getElementById("tanggal").value=new Date().toISOString().slice(0,10);
  document.getElementById("formTitle").textContent="Tambah Berita";
  document.getElementById("saveBtn").textContent="Simpan Berita";
  document.getElementById("cancelBtn").style.display="none";
  preview.style.display="none";preview.src="";
  clearMsg();
}
async function loadList(){
  list.innerHTML="Memuat data...";
  const {data,error}=await supabaseClient.from("berita").select("*").order("created_at",{ascending:false});
  if(error){list.innerHTML='<div class="empty">Gagal memuat berita.</div>';console.error(error);return}
  if(!data.length){list.innerHTML='<div class="empty">Belum ada berita.</div>';return}
  let rows=data.map(b=>{
    const img=imageUrl(b.gambar||b.foto||"");
    return `<tr>
      <td>${img?`<img class="thumb" src="${img}" onerror="this.style.display='none'">`:"🌲"}</td>
      <td><strong>${escapeHtml(b.judul||"-")}</strong><br><small>${escapeHtml(b.kategori||"-")} • ${formatTanggal(b.tanggal)}</small></td>
      <td>
        <button class="secondary smallbtn" onclick="editBerita('${b.id}')">Edit</button>
        <button class="danger smallbtn" onclick="hapusBerita('${b.id}')">Hapus</button>
      </td>
    </tr>`
  }).join("");
  list.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Foto</th><th>Berita</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
window.editBerita=async function(id){
  const {data,error}=await supabaseClient.from("berita").select("*").eq("id",id).single();
  if(error){msg("Gagal mengambil data untuk diedit.",false);return}
  document.getElementById("id").value=data.id;
  document.getElementById("judul").value=data.judul||"";
  document.getElementById("kategori").value=data.kategori||"Berita Sekolah";
  document.getElementById("tanggal").value=(data.tanggal||"").slice(0,10);
  document.getElementById("ringkasan").value=data.ringkasan||"";
  document.getElementById("isi").value=data.isi||"";
  const old=imageUrl(data.gambar||data.foto||"");
  if(old){preview.src=old;preview.style.display="block"}else preview.style.display="none";
  document.getElementById("formTitle").textContent="Edit Berita";
  document.getElementById("saveBtn").textContent="Update Berita";
  document.getElementById("cancelBtn").style.display="inline-block";
  window.scrollTo({top:0,behavior:"smooth"});
};
window.hapusBerita=async function(id){
  if(!confirm("Yakin ingin menghapus berita ini?"))return;
  const {error}=await supabaseClient.from("berita").delete().eq("id",id);
  if(error){msg("Gagal menghapus berita: "+error.message,false);return}
  msg("Berita berhasil dihapus.");
  await loadList();
};
fileInput.addEventListener("change",()=>{
  const f=fileInput.files[0]; if(!f)return;
  preview.src=URL.createObjectURL(f);preview.style.display="block";
});
form.addEventListener("submit",async e=>{
  e.preventDefault(); clearMsg();
  const id=document.getElementById("id").value;
  const judul=document.getElementById("judul").value.trim();
  const kategori=document.getElementById("kategori").value;
  const tanggal=document.getElementById("tanggal").value;
  const ringkasan=document.getElementById("ringkasan").value.trim();
  const isi=document.getElementById("isi").value.trim();
  if(!judul||!isi){msg("Judul dan isi berita wajib diisi.",false);return}
  const payload={judul,kategori,tanggal:tanggal||null,ringkasan,isi,slug:slugify(judul)};
  const file=fileInput.files[0];

  document.getElementById("saveBtn").disabled=true;
  try{
    if(file){
      const safeName=Date.now()+"-"+slugify(file.name);
      const {error:upErr}=await supabaseClient.storage.from("berita").upload(safeName,file,{upsert:true,contentType:file.type});
      if(upErr) throw upErr;
      payload.gambar=safeName;
    }
    let result;
    if(id) result=await supabaseClient.from("berita").update(payload).eq("id",id);
    else result=await supabaseClient.from("berita").insert(payload);
    if(result.error)throw result.error;
    msg(id?"Berita berhasil diperbarui.":"Berita berhasil ditambahkan.");
    resetForm();
    await loadList();
  }catch(err){
    console.error(err);
    msg("Gagal menyimpan: "+err.message,false);
  }finally{
    document.getElementById("saveBtn").disabled=false;
  }
});
document.getElementById("cancelBtn").addEventListener("click",resetForm);
resetForm();
loadList();
</script>
</body>
</html>
