<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pengelolaan | SMK Kehutanan Rimba Bahari</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f4;color:#173b2b}
.top{background:#075c38;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;gap:15px}
.top h1{margin:0;font-size:22px}.top span{font-size:13px;opacity:.85}.top a,.top button{color:#fff;background:transparent;border:0;text-decoration:none;font-weight:bold;cursor:pointer;font-size:14px}
.wrap{max-width:1150px;margin:35px auto;padding:0 20px}.panel{background:#fff;border-radius:16px;box-shadow:0 5px 22px rgba(0,0,0,.08);padding:28px;margin-bottom:25px}
h2{margin-top:0;color:#075c38}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}
label{display:block;font-weight:bold;margin-bottom:7px;color:#174f36}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd8d2;border-radius:9px;font:inherit}textarea{min-height:170px;resize:vertical}
button.action{border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}.primary{background:#087443;color:#fff}.secondary{background:#e7eee9;color:#075c38}.danger{background:#b42318;color:#fff}
.actions{display:flex;gap:10px;margin-top:18px}.status{margin-top:15px;padding:12px;border-radius:8px;display:none}.status.ok{display:block;background:#e5f6eb;color:#126b39}.status.err{display:block;background:#fde9e7;color:#9b241b}
table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #e5ebe7;text-align:left;vertical-align:top}th{background:#f1f6f3;color:#075c38}
.thumb{width:75px;height:55px;object-fit:cover;border-radius:7px;background:#087443}.smallbtn{padding:7px 10px;font-size:12px;margin:2px}.empty{text-align:center;padding:25px;color:#777}.preview{max-width:220px;max-height:150px;border-radius:10px;margin-top:10px;display:none}
#authError{max-width:700px;margin:70px auto;padding:28px;background:#fff;border-radius:16px;text-align:center;box-shadow:0 5px 22px rgba(0,0,0,.08)}
@media(max-width:750px){.grid{grid-template-columns:1fr}.full{grid-column:auto}table{font-size:13px}.top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div id="authError" style="display:none"><h2>Akses Ditolak</h2><p>Silakan masuk terlebih dahulu.</p><a href="signin.html">SIGN IN</a></div>
<div id="app" style="display:none">
<div class="top">
  <div><h1>PENGELOLAAN WEBSITE</h1><span>SMK Kehutanan Rimba Bahari Sumedang</span></div>
  <div><a href="berita.html">← Lihat Website</a> &nbsp; <button id="logoutBtn">KELUAR</button></div>
</div>
<div class="wrap">
  <div class="panel">
    <h2 id="formTitle">Tambah Berita</h2>
    <form id="formBerita">
      <input type="hidden" id="id">
      <div class="grid">
        <div><label>Judul Berita *</label><input id="judul" required placeholder="Contoh: Kegiatan Praktik Lapangan Siswa"></div>
        <div><label>Kategori *</label><select id="kategori" required>
          <option value="Berita Sekolah">Berita Sekolah</option><option value="Kegiatan">Kegiatan</option><option value="Prestasi">Prestasi</option><option value="Pengumuman">Pengumuman</option><option value="Informasi">Informasi</option>
        </select></div>
        <div><label>Tanggal</label><input type="date" id="tanggal"></div>
        <div>
<label>Foto (opsional)</label>
<div style="display:flex;gap:8px;align-items:center">
  <input type="file" id="fotoFile" accept="image/*">
  <button class="action secondary" type="button" id="clearFotoBtn" style="white-space:nowrap">Hapus Foto</button>
</div>
<img id="preview" class="preview" alt="Pratinjau foto">
</div>
        <div class="full"><label>Ringkasan</label><textarea id="ringkasan" style="min-height:90px" placeholder="Ringkasan singkat yang tampil di kartu berita"></textarea></div>
        <div class="full"><label>Isi Berita *</label><textarea id="isi" required placeholder="Tulis isi berita lengkap di sini..."></textarea></div>
      </div>
      <div class="actions"><button class="action primary" type="submit" id="saveBtn">Simpan Berita</button><button class="action secondary" type="button" id="cancelBtn" style="display:none">Batal Edit</button></div>
      <div id="status" class="status"></div>
    </form>
  </div>
  <div class="panel"><h2>Daftar Berita</h2><div id="list">Memuat data...</div></div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient=supabase.createClient("https://xzgbrzabcceqwcaxegfx.supabase.co","sb_publishable_3ZQnb7vOMpsW1MqFVFMX2Q_2oAaQ_qf");
const app=document.getElementById("app"), authError=document.getElementById("authError");
const form=document.getElementById("formBerita"), statusBox=document.getElementById("status"), list=document.getElementById("list"), fileInput=document.getElementById("fotoFile"), preview=document.getElementById("preview"), clearFotoBtn=document.getElementById("clearFotoBtn");
let removeExistingPhoto=false;
let previewObjectUrl="";
function msg(text,ok=true){statusBox.textContent=text;statusBox.className="status "+(ok?"ok":"err")}
function clearMsg(){statusBox.className="status";statusBox.textContent=""}
function slugify(text){return text.toString().toLowerCase().trim().replace(/[^a-z0-9\s-]/g,"").replace(/[\s_-]+/g,"-").replace(/^-+|-+$/g,"")}
function parseTanggal(v){
  if(!v)return null;
  const s=String(v).trim();

  // Format database standar: YYYY-MM-DD
  let m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})$/);
  if(m){
    const d=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    return isNaN(d.getTime())?null:d;
  }

  // Format Indonesia lama: "30 Agustus 2026"
  const bulan={
    januari:0,februari:1,maret:2,april:3,mei:4,juni:5,
    juli:6,agustus:7,september:8,oktober:9,november:10,desember:11
  };
  m=s.toLowerCase().match(/^(\\d{1,2})\\s+([a-z]+)\\s+(\\d{4})$/);
  if(m && bulan[m[2]]!==undefined){
    const d=new Date(Number(m[3]),bulan[m[2]],Number(m[1]));
    return isNaN(d.getTime())?null:d;
  }

  // Coba format tanggal lain yang mungkin tersimpan.
  const d=new Date(s);
  return isNaN(d.getTime())?null:d;
}
function formatTanggal(v){
  const d=parseTanggal(v);
  if(!d)return "-";
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
}
function normalizeDateInput(v){
  const d=parseTanggal(v);
  if(!d)return "";
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function imageUrl(v){if(!v)return "";if(/^https?:\/\//i.test(v)||v.startsWith("/")||v.startsWith("./"))return v;return "https://xzgbrzabcceqwcaxegfx.supabase.co/storage/v1/object/public/berita/"+encodeURIComponent(v)}
function clearPhotoUI(){
  removeExistingPhoto=true;
  if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl="";}
  fileInput.value="";
  preview.removeAttribute("src");
  preview.style.display="none";
}
function resetForm(){
  form.reset();
  document.getElementById("id").value="";
  document.getElementById("tanggal").value=new Date().toISOString().slice(0,10);
  document.getElementById("formTitle").textContent="Tambah Berita";
  document.getElementById("saveBtn").textContent="Simpan Berita";
  document.getElementById("cancelBtn").style.display="none";
  removeExistingPhoto=false;
  if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl="";}
  fileInput.value="";
  preview.removeAttribute("src");
  preview.style.display="none";
  clearMsg();
}
async function loadList(){
  list.innerHTML="Memuat data...";
  const {data,error}=await supabaseClient.from("berita").select("*").order("created_at",{ascending:false});
  if(error){list.innerHTML='<div class="empty">Gagal memuat berita.</div>';console.error(error);return}
  if(!data.length){list.innerHTML='<div class="empty">Belum ada berita.</div>';return}
  let rows=data.map(b=>{const img=imageUrl(b.gambar||b.foto||"");return `<tr><td>${img?`<img class="thumb" src="${img}" onerror="this.style.display='none'">`:"🌲"}</td><td><strong>${escapeHtml(b.judul||"-")}</strong><br><small>${escapeHtml(b.kategori||"-")} • ${formatTanggal(b.tanggal)}</small></td><td><button class="action secondary smallbtn" onclick="editBerita('${b.id}')">Edit</button><button class="action danger smallbtn" onclick="hapusBerita('${b.id}')">Hapus</button></td></tr>`}).join("");
  list.innerHTML=`<div style="overflow:auto"><table><thead><tr><th>Foto</th><th>Berita</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
window.editBerita=async function(id){const {data,error}=await supabaseClient.from("berita").select("*").eq("id",id).single();if(error){msg("Gagal mengambil data untuk diedit.",false);return}document.getElementById("id").value=data.id;document.getElementById("judul").value=data.judul||"";document.getElementById("kategori").value=data.kategori||"Berita Sekolah";document.getElementById("tanggal").value=normalizeDateInput(data.tanggal||"");document.getElementById("ringkasan").value=data.ringkasan||"";document.getElementById("isi").value=data.isi||"";const old=imageUrl(data.gambar||data.foto||"");
removeExistingPhoto=false;
if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);previewObjectUrl="";}
fileInput.value="";
if(old){preview.src=old;preview.style.display="block"}else{preview.removeAttribute("src");preview.style.display="none"};document.getElementById("formTitle").textContent="Edit Berita";document.getElementById("saveBtn").textContent="Update Berita";document.getElementById("cancelBtn").style.display="inline-block";window.scrollTo({top:0,behavior:"smooth"})};
window.hapusBerita=async function(id){if(!confirm("Yakin ingin menghapus berita ini?"))return;const {error}=await supabaseClient.from("berita").delete().eq("id",id);if(error){msg("Gagal menghapus berita: "+error.message,false);return}msg("Berita berhasil dihapus.");await loadList()};
fileInput.addEventListener("change",()=>{
  const f=fileInput.files[0];
  if(!f)return;
  removeExistingPhoto=false;
  if(previewObjectUrl){URL.revokeObjectURL(previewObjectUrl);}
  previewObjectUrl=URL.createObjectURL(f);
  preview.src=previewObjectUrl;
  preview.style.display="block";
});
clearFotoBtn.addEventListener("click",()=>{
  clearPhotoUI();
  msg("Foto sudah dibersihkan. Foto tidak akan disimpan.",true);
});
form.addEventListener("submit",async e=>{e.preventDefault();clearMsg();const id=document.getElementById("id").value, judul=document.getElementById("judul").value.trim(), kategori=document.getElementById("kategori").value, tanggal=document.getElementById("tanggal").value, ringkasan=document.getElementById("ringkasan").value.trim(), isi=document.getElementById("isi").value.trim();if(!judul||!isi){msg("Judul dan isi berita wajib diisi.",false);return}const payload={judul,kategori,tanggal:tanggal||null,ringkasan,isi,slug:slugify(judul)};const file=fileInput.files[0];document.getElementById("saveBtn").disabled=true;try{if(file){
  const safeName=Date.now()+"-"+slugify(file.name);
  const {error:upErr}=await supabaseClient.storage.from("berita").upload(safeName,file,{upsert:true,contentType:file.type});
  if(upErr)throw upErr;
  payload.gambar=safeName;
}else if(id && removeExistingPhoto){
  payload.gambar=null;
}
let result=id?await supabaseClient.from("berita").update(payload).eq("id",id):await supabaseClient.from("berita").insert(payload);if(result.error)throw result.error;msg(id?"Berita berhasil diperbarui.":"Berita berhasil ditambahkan.");resetForm();await loadList()}catch(err){console.error(err);msg("Gagal menyimpan: "+err.message,false)}finally{document.getElementById("saveBtn").disabled=false}});
document.getElementById("cancelBtn").addEventListener("click",resetForm);
document.getElementById("logoutBtn").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.href="signin.html"});
(async()=>{const {data}=await supabaseClient.auth.getSession();if(!data.session){authError.style.display="block";return}app.style.display="block";resetForm();loadList()})();
</script>
</body>
</html>
